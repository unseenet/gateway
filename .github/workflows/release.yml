name: release
# Push a tag like v0.1.0 to release (v0.1.1a1 for a test release: PyPI and GitHub
# mark it as a pre-release). The tag must match __version__ and, for a full
# release, have a section in CHANGELOG.md, which becomes the release notes.
# Versioning as in unseenet: https://github.com/unseenet/unseenet/blob/main/docs/development.md#versioning
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version and the changelog
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); import unseenet_gateway; print(unseenet_gateway.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION" >&2; exit 1
          fi
          case "$VERSION" in
            *a*|*b*|*rc*) ;;   # test releases: the notes are under [Unreleased]
            *) grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; } ;;
          esac
      - run: pip install -e ".[dev]" build twine
      - run: pytest -q
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unseenet-gateway
    permissions:
      id-token: write          # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            { echo "**Test release $VERSION.**"; echo
              awk '/^## \[Unreleased\]/ {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md; } > notes.md
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE="--prerelease=false --latest"
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) PRE="--prerelease --latest=false";; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Unseenet gateway $GITHUB_REF_NAME" --notes-file notes.md $PRE --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Unseenet gateway $GITHUB_REF_NAME" --notes-file notes.md $PRE
          fi
